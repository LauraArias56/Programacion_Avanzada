name: video-games-web

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vgpass}
      POSTGRES_DB: ${POSTGRES_DB:-video_games}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vguser} -d ${POSTGRES_DB:-video_games}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../API_regresion_lineal_multiple
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  vision:
    build:
      context: ../vision_api
      dockerfile: Dockerfile
    ports:
      - "${VISION_PORT:-8100}:8100"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vguser}:${POSTGRES_PASSWORD:-vgpass}@postgres:5432/${POSTGRES_DB:-video_games}
      API_BASE_URL: http://api:8000
      VISION_API_BASE_URL: http://vision:8100
    ports:
      - "${WEBAPP_PORT:-5000}:5000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      vision:
        condition: service_healthy

volumes:
  pgdata:
